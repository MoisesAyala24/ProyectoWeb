<!DOCTYPE html>
<html lang="en">
<title>SDM</title>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{{url_for('static',filename='css/estilos.css')}}" rel="stylesheet">
    <script src="{{url_for('static',filename='js/funciones.js')}}"></script>

    <!-- Archivos de Bootstrap -->
    <link href="{{url_for('static',filename='css/bt-min.css')}}" rel="stylesheet">
    <script src="{{url_for('static',filename='js/bt-bun.js')}}"></script>
    <!-- Archivos de Bootstrap -->
</head>
<body class="bg-dark text-light">

    <nav class="navbar navbar-expand-lg" style="background-color: #6f42c1;">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">SDM</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/">Inicio</a>
                    </li>
                    {% if session.get('usuario') %}
                    <!--<li class="nav-item">
                        <a class="nav-link" href="/productos"></a>
                    </li>-->
                    <li class="nav-item">
                        <a class="nav-link" href="/usuario">
                            {{ session['nombre'] }}
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-warning" href="/logout">
                            Cerrar sesión
                        </a>
                    </li>
                    {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="/login">Login</a>
                    </li>
                    {% endif %}
                    <li class="nav-item">
                        <a class="nav-link" href="/clientes">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true"></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    {% block content %}
    {% endblock %}
    <br>
    <footer class="bg-secondary text-white text-center py-3 mt-5">
        <p class="mb-0">© Mi sitio web. Todos los derechos reservados.</p>
    </footer>

    <script>
    let tiempo;
        function reiniciarTiempo() {
            clearTimeout(tiempo);
            tiempo = setTimeout(function () {
                alert("Sesión cerrada por inactividad");
                window.location = "/logout";
            }, 300000); 
        }

        document.onclick = reiniciarTiempo;
        document.onmousemove = reiniciarTiempo;
        document.onkeypress = reiniciarTiempo;
        reiniciarTiempo();</script>

</body>
</html>
