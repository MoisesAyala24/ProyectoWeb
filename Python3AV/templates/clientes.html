  {% extends 'layout.html' %}

    {% block content %}
<h1>Productos</h1>
<a class="btn btn-primary mb-2" href="/agregar">Agregar</a>
<table class="table table-striped table-dark">
    <thead>
        <tr>
            <th scope="col">ID</th>
            <th scope="col">Producto</th>
            <th scope="col">Vida</th>
            <th scope="col">Precio</th>
            <th scope="col">Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for cliente in Clientes %}
        <tr>
            <th scope="row">{{cliente.0}}</th>
            <td>{{cliente.1}}</td>
            <td>{{cliente.2}}</td>
            <td>{{cliente.3}}</td>
            <td>
                <a class="btn btn-warning" href="/editar-producto/{{cliente.0}}">
                    Editar
                </a>
                <button class="btn btn-danger"
                        onclick="borrarProducto({{cliente.0}})">
                    Borrar
                </button>
            </td>
        </tr>
        <script>
            function borrarProducto(id) {

                if (!confirm("¿Seguro que quieres borrar este producto?")) {
                    return;
                }

                fetch(`/borrar-producto/${id}`)
                    .then(response => response.text())
                    .then(data => {
                        alert("Producto eliminado");

                      
                        location.reload();
                    });
            }
        </script>
        {% endfor %}
    </tbody>
</table>

    {% endblock %}
