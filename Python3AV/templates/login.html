</head>
<body class="bg-light">

    <div class="card shadow">
        <div class="card-body">

            <h3 class="text-center mb-4">
                Iniciar Sesión
            </h3>

            <form action="/validar-login" method="POST">

                <div class="mb-3">
                    <label class="form-label">
                        Correo
                    </label>
                    <input type="email"
                           class="form-control"
                           name="correo"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Contraseña
                    </label>
                    <input type="password"
                           class="form-control"
                           name="password"
                           required>
                </div>

                <button type="submit"
                        class="btn btn-primary w-100">
                    Entrar
                </button>

            </form>

            <div class="text-center mt-3">
                <a href="/registro"
                   data-bs-toggle="modal"
                   data-bs-target="#registroModal">
                    ¿No eres usuario? Regístrate aquí
                </a>
            </div>

        </div>
    </div>
    </div>
    </div>
