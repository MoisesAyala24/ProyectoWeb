{% extends 'layout.html' %}

  {% block content %}
<h1>Editar Producto</h1>

<form action="/actualizar-producto/{{producto.0}}" method="POST">

    <div class="mb-3">
        <label>Nombre</label>
        <input type="text" name="nombre" class="form-control"
               value="{{producto.1}}">
    </div>

    <div class="mb-3">
        <label>Descripción</label>
        <input type="text" name="descripcion" class="form-control"
               value="{{producto.2}}">
    </div>

    <div class="mb-3">
        <label>Precio</label>
        <input type="number" step="0.01" name="precio" class="form-control"
               value="{{producto.3}}">
    </div>

    <button type="submit" class="btn btn-success">
        Guardar cambios
    </button>

</form>
{% endblock %}
